name: Build and deploy

# Builds the static site and uploads it to Güzel Hosting over FTPS.
#
# The site has no build step on the server — see README, "Deploying" — so this
# workflow *is* the deployment: it does exactly what a person would do by hand,
# which is `npm run build` and then put the contents of out/ into the document
# root. Doing it here rather than by hand removes the two failure modes that
# manual deployment has: forgetting one of the two document roots, and zipping
# the build with a tool that mangles the paths.
#
# Requires three repository secrets. Settings -> Secrets and variables ->
# Actions -> New repository secret:
#
#   FTP_SERVER     the hostname from the hosting panel, e.g. mt-....guzelhosting.com
#   FTP_USERNAME   the DirectAdmin account username
#   FTP_PASSWORD   that account's password, or a dedicated FTP account's
#
# Until those exist the deploy job fails and the build job still passes, so a
# pull request is checked either way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping FTP syncs against the same directory
# interleave their uploads and leave the sync state describing neither.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Read at BUILD time and baked into the output. Without both of these the
  # build produces a site whose robots.txt refuses every crawler, which is the
  # deliberate safe default — see lib/deployment.ts.
  SITE_STAGE: production
  NEXT_PUBLIC_SITE_URL: https://www.liquilob.com

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # 24 rather than the LTS default: tools/inquiry-data.mjs imports the
          # .ts content modules directly and relies on Node running TypeScript
          # without a transpile step.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Cheap insurance against a build that succeeds and produces something
      # unservable. Each of these has a specific failure it catches.
      - name: Check the build produced what the server needs
        run: |
          set -e
          test -f out/.htaccess          || { echo "no .htaccess: the site would 404 at /"; exit 1; }
          test -f out/inquiry.php        || { echo "no inquiry.php: the contact form would 404"; exit 1; }
          test -f out/inquiry-data.json  || { echo "no inquiry-data.json: inquiry.php would answer 503"; exit 1; }
          test -f out/tr/index.html      || { echo "Turkish home page missing"; exit 1; }
          test -f out/en/index.html      || { echo "English home page missing"; exit 1; }
          grep -q '^Allow: /' out/robots.txt || { echo "robots.txt refuses crawlers: SITE_STAGE or NEXT_PUBLIC_SITE_URL is not set"; exit 1; }
          echo "out/ contains $(find out -type f | wc -l) files"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: site
          path: out/
          # Without this the artifact silently loses .htaccess, and the deploy
          # would upload a site that 404s at /.
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    # A pull request is built but never deployed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # One at a time: it is a single FTP account, and shared hosting limits
      # concurrent sessions.
      max-parallel: 1
      fail-fast: false
      matrix:
        # Both document roots, because the site is currently served on both
        # domains. If profimann.com is given a redirect to liquilob.com instead
        # of a copy of the site, delete its line here and this becomes a single
        # deployment again.
        target:
          - domains/liquilob.com/public_html
          - domains/profimann.com/public_html
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: site
          path: out

      - name: Deploy to ${{ matrix.target }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explicit TLS on the normal FTP port. Plain `ftp` would put the
          # account password on the wire in clear text.
          protocol: ftps
          local-dir: ./out/
          # Relative to wherever the FTP account lands on login. This assumes
          # it lands at the account root, which is where DirectAdmin normally
          # puts it. If a first run fails complaining about the path, log in
          # with an FTP client and look: an account chrooted to public_html
          # needs these targets shortened accordingly.
          server-dir: ${{ matrix.target }}/
          # Files that live on the server and are not part of the build. An
          # excluded path is neither uploaded nor deleted, which is the point:
          # inquiry-config.php holds the mailbox addresses and would otherwise
          # be at risk, and .well-known is how Let's Encrypt renews the
          # certificate.
          exclude: |
            inquiry-config.php
            .well-known/**
            **/.git*
            **/.git*/**
            **/node_modules/**
